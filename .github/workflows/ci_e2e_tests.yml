name: E2E Connect Tests with Maestro
# WX SLO 2 (WalletKit connect flow works): Kotlin sample dApp ↔ Kotlin sample
# wallet on one emulator, Maestro flows tagged `connect` (.maestro/connect_*.yaml,
# sign_reject.yaml). Same flow names, testIDs and env as react-native-examples'
# ci_e2e_walletkit_connect.yaml.
# "(skip-metrics)" tells the E2E KPI job (WalletConnect/actions) to drop this run.
run-name: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && github.ref_name != 'develop')) && format('{0} (skip-metrics)', github.event.pull_request.title || github.ref_name) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: '0 3 * * *' # Runs every day at 03:00 UTC (default branch)
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its superseded run; scheduled and dispatched runs
# are never cancelled by another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e_connect_android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: E2E Connect - Android
    timeout-minutes: 45
    runs-on: ubuntu-16core
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No Gradle cache, for the same reason as ci_e2e_pay_tests.yml: a restored
      # transforms cache can produce an APK whose dex is missing classes.
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: x86_64

      - name: Setup Required files to build samples
        with:
          # No Gradle cache here either (see the Setup Java step).
          GRADLE_CACHE: 'false'
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          ENCODED_STRING_DEBUG: ${{ secrets.WC_KOTLIN_DEBUG_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_DEBUG: ${{ secrets.WC_KOTLIN_DEBUG_KEYSTORE_PATH }}
          ENCODED_STRING_INTERNAL: ${{ secrets.WC_KOTLIN_INTERNAL_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_INTERNAL: ${{ secrets.WC_KOTLIN_INTERNAL_KEYSTORE_PATH }}
          ENCODED_STRING_UPLOAD: ${{ secrets.WC_KOTLIN_UPLOAD_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_UPLOAD: ${{ secrets.WC_KOTLIN_UPLOAD_KEYSTORE_PATH }}
        uses: ./.github/actions/ci_setup

      # The wallet runs with a fresh generated account: personal_sign needs no funds.
      - name: Build wallet and dApp samples - Internal
        id: build
        env:
          WC_CLOUD_PROJECT_ID: ${{ secrets.WC_CLOUD_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          NOTIFY_INTEGRATION_TESTS_PROJECT_ID: ${{ secrets.NOTIFY_INTEGRATION_TESTS_PROJECT_ID }}
          NOTIFY_INTEGRATION_TESTS_SECRET: ${{ secrets.NOTIFY_INTEGRATION_TESTS_SECRET }}
          MIX_PANEL: ${{ secrets.MIX_PANEL }}
          # No R8 for the internal build (see signing-config.gradle.kts).
          E2E_BUILD: "true"
        run: |
          ./gradlew clean :sample:wallet:assembleInternal :sample:dapp:assembleInternal --no-build-cache
          mkdir -p apks
          cp sample/wallet/build/outputs/apk/internal/*.apk sample/dapp/build/outputs/apk/internal/*.apk apks/
          ls -la apks

      - name: Install Maestro
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the deprecated `tools` package, so override the default.
          packages: platform-tools

      - name: Start Android Emulator and Run Connect Tests
        id: maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          heap-size: 576M
          emulator-boot-timeout: 900
          avd-name: test_device
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          # Installs both APKs, smoke-checks the wallet and runs the `connect`
          # suite, retrying only the failed flows once.
          script: bash .github/scripts/maestro/maestro-android.sh
        env:
          MAESTRO_TAGS: connect
          APP_ID: com.reown.sample.wallet.internal
          DAPP_APP_ID: com.reown.sample.dapp.internal
          APK_DIR: apks
          DEEPLINK_PREFIX: 'kotlin-web3wallet://wc?uri='

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: connect-e2e-debug-artifacts
          path: |
            debug-artifacts/maestro-output/**/*.png
            debug-artifacts/maestro-output/**/*.jpg
            debug-artifacts/maestro-output/**/*.mp4
            debug-artifacts/maestro-output/**/*.mov
            debug-artifacts/maestro-output/**/*.webm
            debug-artifacts/maestro-output.log
            debug-artifacts/junit-attempt-*.xml
            debug-artifacts/android-logcat*.log
          if-no-files-found: warn

      # Also when a flow failed and passed on the retry (junit-attempt-2.xml only
      # exists then), so flakes can be diagnosed from a green run.
      - name: Upload full logcat
        if: failure() || hashFiles('debug-artifacts/junit-attempt-2.xml') != ''
        uses: actions/upload-artifact@v5
        with:
          name: connect-e2e-full-logcat
          path: debug-artifacts/full-logcat.txt
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure() && github.event_name != 'pull_request'
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - Android - WalletKit (connect)",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - Android (connect)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Kotlin`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`Android`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
