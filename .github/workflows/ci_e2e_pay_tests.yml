name: E2E Pay Tests with Maestro
# "(skip-metrics)" tells the E2E KPI job (WalletConnect/actions) to drop this run.
run-name: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && github.ref_name != 'develop')) && format('{0} (skip-metrics)', github.event.pull_request.title || github.ref_name) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: '0 5 * * *' # Runs every day at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its superseded run (freeing the test wallet);
# scheduled and dispatched runs are never cancelled by another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-balance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/e2e_balance_check.yml
    secrets: inherit

  build_and_run_pay_e2e_tests:
    needs: check-balance
    # !cancelled() rather than always(): still runs when check-balance fails or is
    # skipped, but a cancelled run stops (GitHub leaves an `always()` job running).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Build & Run Pay E2E Tests
    timeout-minutes: 45
    runs-on: ubuntu-16core
    # One test wallet for this repo (see derive-e2e-wallet): runs on other refs
    # queue instead of paying from the same account at the same time. GitHub
    # keeps one pending run per group; a newer one replaces it.
    concurrency:
      group: e2e-wallet-kotlin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      # This repo's account in the mnemonic shared with the other SDK repos
      # (index 3; see the action for the reserved indexes), so no other repo's
      # Permit2 reset or nonce races with this suite.
      - name: Derive E2E wallet
        id: wallet
        uses: ./.github/actions/derive-e2e-wallet
        with:
          mnemonic: ${{ secrets.TEST_WALLET_MNEMONIC }}
          index: 3
          expected-address: ${{ vars.TEST_WALLET_ADDRESS }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: x86_64
          # Intentionally NOT caching Gradle for this E2E build. `clean` and
          # `--no-build-cache` wipe the module build dir and task-output cache,
          # but NOT ~/.gradle/caches/transforms-* (artifact-transform / dexing
          # state). On PR runs setup-java restores that from the base branch, and
          # a stale/incompatible transform intermittently produces an APK whose
          # primary dex is missing classes (WalletKitApplication,
          # androidx.core.app.CoreComponentFactory) -> ClassNotFoundException on
          # launch (caught by the smoke check below). Building from a clean Gradle
          # home makes the APK deterministic.

      - name: Setup Required files to build samples
        with:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          ENCODED_STRING_DEBUG: ${{ secrets.WC_KOTLIN_DEBUG_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_DEBUG: ${{ secrets.WC_KOTLIN_DEBUG_KEYSTORE_PATH }}
          ENCODED_STRING_INTERNAL: ${{ secrets.WC_KOTLIN_INTERNAL_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_INTERNAL: ${{ secrets.WC_KOTLIN_INTERNAL_KEYSTORE_PATH }}
          ENCODED_STRING_UPLOAD: ${{ secrets.WC_KOTLIN_UPLOAD_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_UPLOAD: ${{ secrets.WC_KOTLIN_UPLOAD_KEYSTORE_PATH }}
        uses: ./.github/actions/ci_setup

      - name: Build wallet sample - Internal
        id: build
        env:
          WC_CLOUD_PROJECT_ID: ${{ secrets.WC_CLOUD_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          NOTIFY_INTEGRATION_TESTS_PROJECT_ID: ${{ secrets.NOTIFY_INTEGRATION_TESTS_PROJECT_ID }}
          NOTIFY_INTEGRATION_TESTS_SECRET: ${{ secrets.NOTIFY_INTEGRATION_TESTS_SECRET }}
          MIX_PANEL: ${{ secrets.MIX_PANEL }}
          TEST_WALLET_PRIVATE_KEY: ${{ steps.wallet.outputs.private-key }}
          ENABLE_TEST_MODE: "true"
        run: |
          # clean + --no-build-cache so a restored Gradle cache (PRs can restore the
          # base branch's cache, which may predate dependency bumps in this PR) can't
          # produce an inconsistent incremental APK whose dex is missing classes.
          ./gradlew clean :sample:wallet:assembleInternal --no-build-cache

      # Pinned to WalletConnect/actions #116 merge (390045a): flows deliver the payment link via
      # an `openLink` deep link (DEEPLINK_PREFIX) instead of typing it into a test input.
      # The merchant inputs enable the expired-payment pool for pay_expired_link: payments
      # only expire 15 min after creation, so each run uses one an earlier run created
      # (kept in actions/cache) and seeds a new one.
      - name: Copy Maestro Pay test flows
        uses: WalletConnect/actions/maestro/pay-tests@390045a88d335d438c972b422090144158df6823
        with:
          merchant-api-key: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          merchant-id: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}

      - name: Install Maestro
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default `packages` ("tools platform-tools").
          # Google removed the deprecated `tools` package from the SDK repo, so
          # `sdkmanager tools` now fails with "Failed to find package 'tools'".
          packages: platform-tools

      - name: Start Android Emulator and Run Pay Tests
        id: maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          heap-size: 576M
          emulator-boot-timeout: 900
          avd-name: test_device
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          # android-emulator-runner runs each `script` line in its own `sh -c`, so
          # the whole leg lives in one script. It retries only the failed flows once.
          script: bash .github/scripts/maestro/maestro-android.sh
        env:
          APP_ID: com.reown.sample.wallet.internal
          APK_DIR: sample/wallet/build/outputs/apk/internal
          DEEPLINK_PREFIX: 'kotlin-web3wallet://wc?uri='
          WPAY_CUSTOMER_KEY_SINGLE_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          WPAY_MERCHANT_ID_SINGLE_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_NOKYC }}
          WPAY_MERCHANT_ID_MULTI_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_KYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_KYC }}
          WPAY_MERCHANT_ID_MULTI_KYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_KYC }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pay-e2e-debug-artifacts
          path: |
            debug-artifacts/maestro-output/**/*.png
            debug-artifacts/maestro-output/**/*.jpg
            debug-artifacts/maestro-output/**/*.jpeg
            debug-artifacts/maestro-output/**/*.mp4
            debug-artifacts/maestro-output/**/*.mov
            debug-artifacts/maestro-output/**/*.webm
            debug-artifacts/maestro-output/**/*.gif
            debug-artifacts/maestro-output.log
            debug-artifacts/junit-attempt-*.xml
            debug-artifacts/maestro-debug/**/maestro.log
            debug-artifacts/maestro-debug/**/commands-*.json
            debug-artifacts/android-logcat*.log
          if-no-files-found: warn

      # The full logcat is large and only useful when something failed.
      - name: Upload full logcat
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pay-e2e-full-logcat
          path: debug-artifacts/full-logcat.txt
          if-no-files-found: ignore

      # Reset the USDT Permit2 allowance back to 0 so the next pay_usdt_polygon run
      # re-exercises the approve step. Runs even when the suite failed (if: always())
      # so a mid-flow failure doesn't leave the allowance set. Uses the shared
      # permit2-reset action (the private key goes via env, never the CLI).
      # continue-on-error so a reset hiccup can't fail an otherwise-green run.
      - name: Reset USDT Permit2 allowance (Polygon)
        if: always()
        continue-on-error: true
        uses: WalletConnect/actions/maestro/permit2-reset@390045a88d335d438c972b422090144158df6823
        with:
          chain-id: eip155:137
          # polygon-rpc.com is gated (HTTP 401 "tenant disabled") in CI; use publicnode.
          rpc-url: https://polygon-bor-rpc.publicnode.com
          token-address: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F'
          private-key: ${{ steps.wallet.outputs.private-key }}

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - Android - WalletKit",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - Android (pay)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Kotlin`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`Android`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }

