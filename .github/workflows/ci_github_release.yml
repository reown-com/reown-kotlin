name: Create GitHub Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'BOM version (e.g., 1.6.5)'
        required: true
        type: string

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the BOM_ tag and GitHub release
      actions: write # dispatch the sample apps release build
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: master

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        bash .github/scripts/create-github-release.sh "BOM_${VERSION}" "$(git rev-parse HEAD)"
