name: R8 dex repro (temporary)

on:
  push:
    branches:
      - claude/r8-dex-repro

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [dapp, wallet]
        shard: [1, 2, 3]
    name: ${{ matrix.app }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Required files to build samples
        with:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          ENCODED_STRING_DEBUG: ${{ secrets.WC_KOTLIN_DEBUG_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_DEBUG: ${{ secrets.WC_KOTLIN_DEBUG_KEYSTORE_PATH }}
          ENCODED_STRING_INTERNAL: ${{ secrets.WC_KOTLIN_INTERNAL_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_INTERNAL: ${{ secrets.WC_KOTLIN_INTERNAL_KEYSTORE_PATH }}
          ENCODED_STRING_UPLOAD: ${{ secrets.WC_KOTLIN_UPLOAD_KEYSTORE }}
          SIGNING_KEY_STORE_PATH_UPLOAD: ${{ secrets.WC_KOTLIN_UPLOAD_KEYSTORE_PATH }}
        uses: ./.github/actions/ci_setup

      - name: Build and verify repeatedly
        env:
          WC_CLOUD_PROJECT_ID: ${{ secrets.WC_CLOUD_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          NOTIFY_INTEGRATION_TESTS_PROJECT_ID: ${{ secrets.NOTIFY_INTEGRATION_TESTS_PROJECT_ID }}
          NOTIFY_INTEGRATION_TESTS_SECRET: ${{ secrets.NOTIFY_INTEGRATION_TESTS_SECRET }}
          MIX_PANEL: ${{ secrets.MIX_PANEL }}
          ITERATIONS: ${{ vars.R8_REPRO_ITERATIONS || '6' }}
        run: |
          set -u
          APP=${{ matrix.app }}
          DEXDUMP=$(ls -d "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -1)
          echo "dexdump: $DEXDUMP"
          mkdir -p out
          ok=0; bad=0
          for i in $(seq 1 "$ITERATIONS"); do
            if [ "$i" = 1 ]; then
              ./gradlew ":sample:$APP:assembleInternal" -x lint --stacktrace
            else
              ./gradlew ":sample:$APP:minifyInternalWithR8" --rerun ":sample:$APP:assembleInternal" -x lint
            fi
            apk=$(ls sample/$APP/build/outputs/apk/internal/*.apk | head -1)
            rm -rf dexcheck && mkdir dexcheck && unzip -q -o "$apk" 'classes*.dex' -d dexcheck
            failed=0
            for d in dexcheck/classes*.dex; do
              if ! "$DEXDUMP" -f "$d" > "dexcheck/$(basename $d).log" 2>&1 || grep -q "Failure to verify\|Out-of-order\|Failed to" "dexcheck/$(basename $d).log"; then
                echo "::error::iteration $i: $d failed verification"; cat "dexcheck/$(basename $d).log" | tail -5; failed=1
              fi
            done
            dest="out/iter-$i-$([ $failed = 1 ] && echo BAD || echo good)"
            mkdir -p "$dest"
            cp "$apk" "$dest/"
            cp -r sample/$APP/build/outputs/mapping "$dest/" 2>/dev/null || true
            if [ $failed = 1 ]; then bad=$((bad+1)); else ok=$((ok+1)); fi
          done
          echo "RESULT $APP shard ${{ matrix.shard }}: good=$ok bad=$bad" | tee -a "$GITHUB_STEP_SUMMARY"
          # keep at most 2 good builds to limit artifact size
          ls -d out/iter-*-good | tail -n +3 | xargs -r rm -rf
          [ $bad = 0 ]

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r8-${{ matrix.app }}-${{ matrix.shard }}
          path: out/
          retention-days: 5
