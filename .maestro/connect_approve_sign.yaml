appId: ${APP_ID}
name: WalletKit Connect - Connect, sign message and disconnect
tags:
  - connect
---
# SLO 2 critical path: dApp → pairing → session proposal → wallet approves →
# session settled → sign request handled.
# Env: APP_ID (wallet), DAPP_APP_ID (dApp, optional).

- clearState
- runFlow: flows/connect_launch_wallet.yaml
- runFlow: flows/connect_open_dapp.yaml

- startRecording: "Connect - Connect, sign message and disconnect"

# Pairing + session proposal + session settled
- runFlow: flows/connect_select_wallet.yaml
- runFlow: flows/connect_approve_session.yaml

# Sign request (personal_sign)
- runFlow: flows/connect_send_sign.yaml
- tapOn:
    id: "wallet-request-approve"
- extendedWaitUntil:
    notVisible:
      id: "wallet-request-approve"
    timeout: 30000
- runFlow: flows/connect_back_to_dapp.yaml
- extendedWaitUntil:
    visible: "result_message"
    timeout: 30000

- runFlow: flows/connect_disconnect_dapp.yaml

- stopRecording
