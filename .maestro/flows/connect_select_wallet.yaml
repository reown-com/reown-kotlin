appId: ${APP_ID}
---
# Shared flow: from the dApp, open the AppKit modal and pick the internal Kotlin
# sample wallet ("Android Sample Internal" in the wallet directory, which lists
# it with the internal build's deep link). Ends with the session proposal in
# the wallet.
# The row is rendered by AppKit from the WalletConnect explorer listing, so it
# can't carry a testTag: if that listing is renamed, update the name here.

- tapOn:
    id: "connect-button"
- extendedWaitUntil:
    visible: "All wallets"
    timeout: 30000

# Done once the wallet shows the session proposal. Each tap waits for the
# modal to settle and is repeated only while its target is still on screen.
- retry:
    maxRetries: 3
    commands:
      - runFlow: connect_settle.yaml
      - runFlow:
          when:
            visible: "All wallets"
          commands:
            - tapOn: "All wallets"
      - extendedWaitUntil:
          visible: "Android Sample Internal"
          timeout: 30000
      - runFlow: connect_settle.yaml
      - runFlow:
          when:
            visible: "Android Sample Internal"
          commands:
            - tapOn: "Android Sample Internal"
      - extendedWaitUntil:
          visible:
            id: "wallet-request-approve"
          timeout: 20000
