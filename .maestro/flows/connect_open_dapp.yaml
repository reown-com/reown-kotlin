appId: ${APP_ID}
---
# Shared flow: start the Kotlin sample dApp (sample/dapp, internal build) from a
# clean state and select Ethereum, so "Connect via AppKit" opens the modal.
# Env: DAPP_APP_ID (defaults to the internal build's package).

- evalScript: ${output.dappAppId = (typeof DAPP_APP_ID !== 'undefined' && DAPP_APP_ID) || 'com.reown.sample.dapp.internal'}

- clearState: ${output.dappAppId}
- runFlow:
    file: connect_launch_dapp.yaml

- extendedWaitUntil:
    visible:
      id: "connect-button"
    timeout: 30000
- tapOn: "Ethereum"
