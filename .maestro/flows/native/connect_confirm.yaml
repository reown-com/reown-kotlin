appId: com.reown.sample.dapp.internal
name: Kotlin Dapp to Kotlin Wallet Connection Confirmed
---
- clearState
- launchApp:
    permissions:
      all: allow
- startRecording: "Native Connection Confirmed"
# Press NOT NOW in case the Enabling testing features modal appears
- runFlow:
    when:
      visible: "NOT NOW"
    commands:
      - tapOn: "NOT NOW"
- extendedWaitUntil:
    visible:
      text: "Chain selection"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Ethereum"
    timeout: 15000
- tapOn: "Ethereum"
- tapOn: "Connect via AppKit"
- extendedWaitUntil:
    visible:
      text: "All wallets"
    timeout: 15000
- tapOn: "All wallets"
- extendedWaitUntil:
    visible:
      text: "Android Sample Internal"
    timeout: 30000
- tapOn: "Android Sample Internal"
- extendedWaitUntil:
    visible:
      id: "wallet-request-approve"
    timeout: 30000
- tapOn:
    id: "wallet-request-approve"
# Establishing the first session requires a full relay round-trip (wallet approve
# -> relay -> dapp settles the session -> navigates to the connected chain). This
# is the slowest step in the flow and noticeably slower on CI emulators, so allow
# generous time before asserting the connected chain is shown.
- extendedWaitUntil:
    visible:
      text: "Ethereum_main"
    timeout: 60000
- stopRecording
