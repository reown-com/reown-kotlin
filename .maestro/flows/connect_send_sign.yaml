appId: ${APP_ID}
---
# Shared flow: from the dApp's "Session Chains" screen, open Ethereum and send
# personal_sign. The caller then brings the wallet forward
# (connect_wallet_request.yaml).
- tapOn: "ETHEREUM_MAIN"
- extendedWaitUntil:
    visible:
      id: "sign-message-button"
    timeout: 15000
- tapOn:
    id: "sign-message-button"
