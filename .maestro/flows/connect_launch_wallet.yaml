appId: ${APP_ID}
---
# Shared flow: cold-start the wallet and wait until it is ready, so WalletKit is
# initialised (relay connected) before the dApp hands it a pairing URI.
# Same as react-native-examples' flows/connect_launch_wallet.yaml.

# The caller's clearState tears the old task down ~1s later and can kill a
# process forked before then. Maestro has no sleep, so wait (optionally) for an
# id that never appears.
- extendedWaitUntil:
    visible:
      id: "maestro-wait-for-task-teardown"
    timeout: 1000
    optional: true

# 45s per attempt covers a slow cold start on a contended CI emulator.
- retry:
    maxRetries: 3
    commands:
      - stopApp:
          appId: ${APP_ID}
      - launchApp:
          appId: ${APP_ID}
          permissions:
            all: allow
      - extendedWaitUntil:
          visible:
            id: "button-scan"
          timeout: 45000
